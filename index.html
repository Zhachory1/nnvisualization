<html>
  <head>
    <title>Neural Network Visualization - Linear Regression Demo</title>
    <!-- Load TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        max-width: 800px;
        margin: 40px auto;
        padding: 20px;
        line-height: 1.6;
      }
      h1 { color: #333; }
      h2 { color: #666; margin-top: 30px; }
      .section {
        background: #f5f5f5;
        padding: 15px;
        border-radius: 8px;
        margin: 15px 0;
      }
      .data-table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 10px;
      }
      .data-table th,
      .data-table td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
      }
      .data-table th {
        background-color: #4CAF50;
        color: white;
      }
      .status {
        font-weight: bold;
        color: #4CAF50;
      }
      .prediction {
        font-size: 1.2em;
        color: #2196F3;
        font-weight: bold;
      }
      #demo { display: none; }
    </style>
  </head>

  <body>
    <h1>🧠 Neural Network Visualization</h1>
    <p>Linear Regression Demo with TensorFlow.js</p>
    
    <div class="section">
      <h2>📊 Loaded Data</h2>
      <div id="data-display">Loading CSV data...</div>
    </div>

    <div class="section">
      <h2>🎯 Training Progress</h2>
      <div id="training-status">Waiting to start training...</div>
      <div id="loss-display"></div>
    </div>

    <div class="section">
      <h2>🔮 Prediction Result</h2>
      <div id="prediction-display">Model not trained yet...</div>
    </div>

    <p id="demo"></p>
    <script src="main.js"></script>
  </body>
</html>
